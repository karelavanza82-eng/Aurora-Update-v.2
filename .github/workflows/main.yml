name: Build Original Release APK

on:
  workflow_dispatch:

jobs:
  build_original_release:
    name: Build original ConvX release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original ConvX source
        uses: actions/checkout@v4
        with:
          repository: cosmictaserdev-creator/Convx
          ref: main
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain -x lint

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: convx-original-release
          path: app/build/outputs/apk/universalGms/release/*.apk

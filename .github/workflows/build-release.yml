name: Build Aurora Release APK

on:
  workflow_dispatch:

jobs:
  build_release:
    name: Build Aurora release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Raise JVM memory for CI runner
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -Xms512m -XX:ReservedCodeCacheSize=512m -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC/' gradle.properties

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain -x lint

      - name: Sign release APK
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          UNSIGNED=$(find app/build/outputs/apk/universalGms/release -name '*unsigned*.apk' | head -n1)
          mkdir -p signed
          "$BT/zipalign" -f -p 4 "$UNSIGNED" signed/aligned.apk
          "$BT/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out signed/aurora-release.apk \
            signed/aligned.apk
          "$BT/apksigner" verify --verbose signed/aurora-release.apk

      - name: Upload Aurora APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-release
          path: signed/aurora-release.apk
